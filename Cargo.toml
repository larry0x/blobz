[package]
name        = "blobz"
version     = "0.2.1"
edition     = "2024"
description = "Content-addressed file store with a database catalog"
repository  = "https://github.com/larry0x/blobz"
license     = "Apache-2.0"

[features]
# A catalog on redb: the `redb` module and the `Redb` type.
catalog-redb   = ["dep:redb"]
# A catalog on SQLite: the `sqlite` module and the `Sqlite` type. The app picks
# the SQLite library, for example with rusqlite's `bundled` feature.
catalog-sqlite = ["dep:rusqlite"]
# Nine ready-made formats, `identify`, and the `formats!` macro.
format-presets = ["dep:infer"]
# The BLAKE3 hasher, and BLAKE3 as the store's default hasher.
hasher-blake3  = ["dep:blake3"]
# The SHA-256 hasher.
hasher-sha256  = ["dep:sha2"]
# Serialize and deserialize `Digest` as a hex string.
serde          = ["dep:serde"]

[dependencies]
blake3    = { version = "1", default-features = false, features = ["std"], optional = true }
hex       = { version = "0.4", default-features = false, features = ["std"] }
infer     = { version = "0.22", default-features = false, optional = true }
redb      = { version = "5", default-features = false, features = ["std"], optional = true }
rusqlite  = { version = "0.43", default-features = false, features = ["cache"], optional = true }
serde     = { version = "1", default-features = false, features = ["std"], optional = true }
sha2      = { version = "0.11", default-features = false, optional = true }
tempfile  = "3"
thiserror = "2"

[dev-dependencies]
# The `catalog-sqlite` feature links whatever SQLite the app picks; the
# tests bring their own.
rusqlite   = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
