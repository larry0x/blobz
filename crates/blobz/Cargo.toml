[package]
name        = "blobz"
version     = "0.2.1"
edition     = "2024"
description = "Content-addressed file store with a database catalog"
repository  = "https://github.com/larry0x/libraries"
license     = "Apache-2.0"

[features]
# A catalog on redb: the `redb` module and the `Redb` type.
catalog-redb   = ["dep:redb"]
# A catalog on SQLite: the `sqlite` module and the `Sqlite` type. The app picks
# the SQLite library, for example with rusqlite's `bundled` feature.
catalog-sqlite = ["dep:rusqlite"]
# Nine ready-made formats, `identify`, and the `formats!` macro.
format-presets = ["dep:infer"]
# The BLAKE3 hasher, and BLAKE3 as the store's default hasher.
hasher-blake3  = ["dep:blake3"]
# The SHA-256 hasher.
hasher-sha256  = ["dep:sha2"]
# Serialize and deserialize `Digest` as a hex string.
serde          = ["dep:serde"]

[dependencies]
blake3    = { workspace = true, features = ["std"], optional = true }
hex       = { workspace = true, features = ["std"] }
infer     = { workspace = true, optional = true }
redb      = { workspace = true, features = ["std"], optional = true }
rusqlite  = { workspace = true, features = ["cache"], optional = true }
serde     = { workspace = true, features = ["std"], optional = true }
sha2      = { workspace = true, optional = true }
tempfile  = { workspace = true, features = ["getrandom"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# The `catalog-sqlite` feature links whatever SQLite the app picks; the
# tests bring their own.
rusqlite   = { workspace = true, features = ["bundled", "cache"] }
serde      = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
